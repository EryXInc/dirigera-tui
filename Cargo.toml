[package]
name = "dirigera-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Terminal UI for controlling IKEA DIRIGERA smart home devices"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
